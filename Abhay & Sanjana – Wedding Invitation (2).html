<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhay &amp; Sanjana – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bl:#fbe4e2;--iv:#fff8f4;--rg:#b76e79;--dp:#7d2e41;--go:#c99a6b;--tx:#4a2630;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--iv);color:var(--tx);font:500 18px/1.55 'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
h1,h2{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;color:var(--dp);margin:0}
section{max-width:520px;margin:0 auto;padding:44px 22px;text-align:center}
.bg{background:radial-gradient(circle at 50% 0,#fff 0,var(--bl) 70%)}
.btn{display:inline-block;border:0;border-radius:30px;padding:12px 26px;font:600 17px 'Cormorant Garamond',serif;background:linear-gradient(135deg,#c98591,var(--dp));color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 4px 14px #7d2e4155}
.btn:focus-visible,#seal:focus-visible,#pull:focus-visible{outline:3px solid var(--go);outline-offset:3px}
.btn.off{opacity:.5;pointer-events:none}
/* intro */
#intro{position:fixed;inset:0;z-index:50;background:var(--bl);overflow:hidden;touch-action:none}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(160deg,#f4c9cd,#e3a1ab);transition:transform 1.3s cubic-bezier(.7,0,.2,1)}
.dl{left:0;border-right:2px solid var(--go)}.dr{right:0;border-left:2px solid var(--go)}
.door::after{content:"";position:absolute;inset:14px;border:1px solid #fff9;border-radius:6px}
#intro.open .dl{transform:translateX(-101%)}#intro.open .dr{transform:translateX(101%)}
#seal{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px;border:0;border-radius:50%;background:none;padding:0;cursor:pointer;z-index:3;transition:transform .6s,opacity .6s;animation:pulse 2s infinite}
#intro.open #seal{transform:scale(1.6);opacity:0;pointer-events:none;animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
#hint{position:absolute;left:0;right:0;top:calc(50% + 80px);text-align:center;color:var(--dp);z-index:3}
#inner{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(#fff,var(--bl));opacity:0;transition:opacity .8s 1s;text-align:center;z-index:1}
#intro.open #inner{opacity:1}
#inner .t{font-family:'Great Vibes',cursive;font-size:44px;color:var(--dp);margin-top:-90px}
#rb{position:absolute;left:0;right:0;top:50%;height:46px;margin-top:-10px;background:linear-gradient(#e9aab3,#c4707d 50%,#e9aab3);box-shadow:0 3px 8px #0003;z-index:2;opacity:0;transition:transform .9s,opacity .6s}
#intro.open #rb{opacity:1;transition-delay:1.1s}
#rb.gone{transform:translateY(120vh) rotate(8deg);opacity:0!important;transition-delay:0s}
#pull{position:absolute;left:50%;top:100%;width:54px;margin-left:-27px;text-align:center;background:none;border:0;color:var(--dp);font:600 15px 'Cormorant Garamond',serif;cursor:grab;touch-action:none}
#pull svg{display:block;margin:-14px auto 0}
#intro.done{opacity:0;pointer-events:none;transition:opacity 1s}
/* hero */
#hero .ol{font-family:'Tiro Devanagari Hindi',serif;color:var(--rg);font-size:22px;margin-bottom:26px}
#names{font-family:'Great Vibes',cursive;font-size:clamp(52px,17vw,80px);line-height:1.05;color:var(--dp);min-height:3.3em}
#names span{display:block}.amp{font-size:.55em;color:var(--go)}
.fam{font-size:16px;color:#7a5560;margin:6px 0}
.ph{width:200px;height:260px;margin:18px auto;border-radius:100px 100px 14px 14px;border:4px solid var(--go);object-fit:cover;box-shadow:0 8px 24px #7d2e4133;background:#f3cfd2}
.cd{display:flex;gap:10px;justify-content:center;margin:18px 0}
.cd div{min-width:64px;padding:10px 4px;border:1px solid var(--go);border-radius:12px;background:#fff}
.cd b{display:block;font-size:30px;color:var(--dp)}.cd small{font-size:14px}
/* functions */
.fn{margin:16px 0;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 6px 20px #7d2e4122;text-align:left}
.fn header{padding:12px 20px;color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.fn header h2{color:#fff;font-size:34px}.fn header span{font-weight:600}
.fn p{margin:0;padding:6px 20px}.fn p:last-child{padding-bottom:16px}
/* story */
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 22px 16px;max-width:100%}
.car img{flex:0 0 72%;max-width:300px;height:380px;object-fit:cover;border-radius:16px;scroll-snap-align:center;border:3px solid #fff;box-shadow:0 6px 18px #7d2e4133;background:#f3cfd2}
.cnt{display:inline-flex;align-items:center;gap:18px;margin:14px 0}
.cnt button{width:44px;height:44px;border-radius:50%;border:1px solid var(--rg);background:#fff;font-size:24px;color:var(--dp);cursor:pointer}
.cnt b{font-size:30px;min-width:30px}
#mus{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;border:0;background:var(--dp);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 12px #0004}
.pt{position:fixed;top:-30px;z-index:60;pointer-events:none;border-radius:60% 0 60% 0;background:radial-gradient(circle at 30% 30%,#f7b6c0,#d8657c);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;scroll-behavior:auto!important}}
</style></head><body>

<div id="intro">
 <div class="door dl"></div><div class="door dr"></div>
 <div id="inner"><div class="t">Abhay &amp; Sanjana</div></div>
 <div id="rb"><button id="pull" aria-label="Pull the ribbon to open the invitation"><svg width="30" height="44" viewBox="0 0 30 44"><path d="M15 0v26" stroke="#c4707d" stroke-width="5"/><path d="M15 24l-11 18h22z" fill="#c4707d"/></svg>Pull</button></div>
 <button id="seal" aria-label="Tap the seal to open"><svg viewBox="0 0 112 112"><defs><radialGradient id="g" cx=".35" cy=".3"><stop offset="0" stop-color="#d8566e"/><stop offset="1" stop-color="#7d1f35"/></radialGradient></defs><path d="M56 3l12 8 14-3 7 12 14 5-2 14 8 11-8 11 2 14-14 5-7 12-14-3-12 8-12-8-14 3-7-12-14-5 2-14L3 56l8-11-2-14 14-5 7-12 14 3z" fill="url(#g)"/><circle cx="56" cy="56" r="34" fill="none" stroke="#f3b4be" stroke-width="2"/><text x="56" y="66" text-anchor="middle" font-family="Great Vibes,cursive" font-size="34" fill="#ffe3e6">A&amp;S</text></svg></button>
 <div id="hint">Tap the seal</div>
</div>

<main>
<section id="hero" class="bg">
 <div class="ol" id="ol"></div>
 <div id="names" aria-label="Abhay and Sanjana"></div>
 <img class="ph" id="couple" alt="Abhay and Sanjana">
 <div class="fam" id="fam"></div>
 <p>invite you to celebrate their wedding</p>
 <h2 id="dt" style="font-size:40px"></h2>
 <div class="cd" id="cd" aria-live="off"></div>
 <a class="btn" id="cal" target="_blank" rel="noopener">Add to Google Calendar</a>
</section>

<section><h2 style="font-size:46px">Wedding Celebrations</h2><div id="fns"></div></section>

<section class="bg"><h2 style="font-size:46px">Our Story</h2><div class="car" id="car" tabindex="0" aria-label="Photos"></div></section>

<section><h2 style="font-size:46px">Venue</h2><p id="ven"></p><a class="btn" id="dir" target="_blank" rel="noopener">Get directions</a></section>

<section class="bg"><h2 style="font-size:46px">Will you join us?</h2><p>How many guests are coming?</p>
 <div class="cnt"><button id="mn" aria-label="Fewer guests">−</button><b id="n">2</b><button id="pl" aria-label="More guests">+</button></div><br>
 <a class="btn" id="rsvp" target="_blank" rel="noopener">RSVP on WhatsApp</a><p id="by" style="font-size:16px"></p>
 <p style="margin-top:36px;color:var(--rg)">With love, the families of Abhay &amp; Sanjana</p></section>
</main>
<button id="mus" aria-label="Music on or off" style="display:none">♪</button>

/* ============================================================ */
const $=i=>document.getElementById(i),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const MN=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
$('ol').textContent=C.opening;
$('fam').innerHTML=C.groomFam+"<br>&amp;<br>"+C.brideFam;
$('couple').src=IMGS[0];
$('dt').textContent=C.weddingDay+" "+MN[C.weddingMonth]+" "+C.year;
$('fns').innerHTML=C.fns.map(f=>`<article class="fn"><header style="background:${f.col}"><h2>${f.n}</h2><span>${f.d} ${MN[f.m]}</span></header>
<p>🕒 ${f.time||"Time will be shared soon"}</p><p>📍 ${f.place||"Place will be shared soon"}</p>${f.dress?`<p>👗 Dress code: ${f.dress}</p>`:""}</article>`).join("");
$('car').innerHTML=IMGS.map((s,i)=>`<img src="${s}" alt="Abhay and Sanjana photo ${i+1}" loading="lazy">`).join("");
$('ven').innerHTML=(C.venueName||"Venue details will be shared soon")+(C.venueAddr?"<br>"+C.venueAddr:"")+(C.muhurat?"<br>Pheras: "+C.muhurat:"");
const dir=$('dir');C.mapsLink?dir.href=C.mapsLink:dir.classList.add('off');
const p2=n=>String(n).padStart(2,"0"),ds=`${C.year}${p2(C.weddingMonth)}${p2(C.weddingDay)}`,de=`${C.year}${p2(C.weddingMonth)}${p2(C.weddingDay+1)}`;
$('cal').href=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(C.first+" & "+C.second+" Wedding")}&dates=${ds}/${de}&details=${encodeURIComponent("Wedding of "+C.first+" & "+C.second)}${C.venueAddr?"&location="+encodeURIComponent(C.venueAddr):""}`;
function tick(){let s=Math.max(0,(new Date(C.year,C.weddingMonth-1,C.weddingDay)-Date.now())/1000|0);const v=[s/86400|0,s%86400/3600|0,s%3600/60|0,s%60],l=["Days","Hours","Mins","Secs"];
$('cd').innerHTML=v.map((x,i)=>`<div><b>${x}</b><small>${l[i]}</small></div>`).join("")}
tick();setInterval(tick,1000);
let g=2;const sh=()=>{$('n').textContent=g;
 const t=`Namaste! We would love to attend the wedding of ${C.first} & ${C.second} (${C.weddingDay} ${MN[C.weddingMonth]} ${C.year}). Guests: ${g}`;
 $('rsvp').href=`https://wa.me/${C.rsvpPhone.replace(/\D/g,"")}?text=${encodeURIComponent(t)}`};
$('mn').onclick=()=>{g=Math.max(1,g-1);sh()};$('pl').onclick=()=>{g=Math.min(20,g+1);sh()};sh();
$('by').textContent=C.rsvpBy?"Please reply by "+C.rsvpBy:"";
function petals(n){if(RM)return;for(let i=0;i<n;i++){const p=document.createElement('span'),s=10+Math.random()*14;p.className='pt';
 p.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;--dx:${Math.random()*120-60}px;animation-duration:${4+Math.random()*4}s;animation-delay:${Math.random()*2}s`;
 document.body.appendChild(p);setTimeout(()=>p.remove(),10500)}}
function write(){const el=$('names'),parts=[C.first,"&",C.second];el.innerHTML=parts.map((p,i)=>`<span${i==1?' class="amp"':''}></span>`).join("");
 const sp=el.children;if(RM){parts.forEach((p,i)=>sp[i].textContent=p);return}
 let a=0,b=0;const t=setInterval(()=>{if(a>=3){clearInterval(t);return}sp[a].textContent=parts[a].slice(0,++b);if(b>=parts[a].length){a++;b=0}},110)}
/* music: drone + tabla + shehnai-like reed, synthesised */
let ac,tm,on=false;
function note(g,t,f){const o=ac.createOscillator(),b=ac.createBiquadFilter(),e=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
 o.type='sawtooth';o.frequency.value=f;b.type='bandpass';b.frequency.value=1400;b.Q.value=3;l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);
 e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.22,t+.15);e.gain.linearRampToValueAtTime(0,t+1.2);o.connect(b);b.connect(e);e.connect(g);o.start(t);l.start(t);o.stop(t+1.3);l.stop(t+1.3)}
function music(x){on=x;$('mus').style.opacity=x?1:.55;
 if(!x){clearInterval(tm);ac&&ac.suspend();return}
 if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const g=ac.createGain();g.gain.value=.14;g.connect(ac.destination);ac.g=g;
  [130.8,196].forEach(f=>{const o=ac.createOscillator(),l=ac.createBiquadFilter(),v=ac.createGain();o.type='sawtooth';o.frequency.value=f;l.type='lowpass';l.frequency.value=500;v.gain.value=.15;o.connect(l);l.connect(v);v.connect(g);o.start()})}
 ac.resume();const sc=[261.6,277.2,329.6,349.2,392,415.3,493.9,523.3];let i=0,k=0;
 tm=setInterval(()=>{const t=ac.currentTime,o=ac.createOscillator(),e=ac.createGain();o.frequency.setValueAtTime(i%4?190:110,t);o.frequency.exponentialRampToValueAtTime(70,t+.2);
  e.gain.setValueAtTime(.6,t);e.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(e);e.connect(ac.g);o.start(t);o.stop(t+.3);
  if(i%3==0){k=Math.max(0,Math.min(7,k+[-2,-1,1,2][Math.random()*4|0]));note(ac.g,t,sc[k])}i++},480)}
$('mus').onclick=()=>{music(!on);petals(26)};
/* opening: seal → doors → ribbon pull */
const I=$('intro');let opened=false;
$('seal').onclick=()=>{if(opened)return;opened=true;I.classList.add('open');$('hint').textContent="Pull the ribbon to untie it";if(C.music){$('mus').style.display='block';music(true)}else $('mus').style.display='block'};
const rb=$('rb'),pl=$('pull');let y0=null;
function untie(){if(rb.classList.contains('gone'))return;rb.classList.add('gone');$('hint').style.display='none';
 setTimeout(()=>{I.classList.add('done');petals(34);write()},700);setTimeout(()=>I.remove(),2000)}
pl.addEventListener('pointerdown',e=>{y0=e.clientY;pl.setPointerCapture(e.pointerId)});
pl.addEventListener('pointermove',e=>{if(y0!==null){const d=Math.max(0,e.clientY-y0);rb.style.transform=`translateY(${d}px)`;if(d>90)untie()}});
pl.addEventListener('pointerup',e=>{if(y0!==null&&e.clientY-y0<8)untie();y0=null;if(!rb.classList.contains('gone'))rb.style.transform=''});
pl.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' ')untie()});
</script></body></html>
